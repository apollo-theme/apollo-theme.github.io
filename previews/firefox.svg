<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Apollo Dark for Firefox — simulated preview</title>
<desc id="desc">A clearly labeled simulated Firefox interface using the Apollo Dark color palette.</desc>
<style>.canvas{fill:#141617}.frame,.panel{fill:#141617;stroke:#3c3836;stroke-width:1}.raised,.toolbar{fill:#1d2021;stroke:#3c3836;stroke-width:1}.body,.bright,.dim,.label,.accent,.success,.info,.line-number,.canvas-text,.stamp,.title-small{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.body{fill:#cfbc97;font-size:18px}.bright{fill:#fbf1c7;font-size:18px}.dim{fill:#d5c4a1;font-size:16px}.label{fill:#d5c4a1;font-size:14px;font-weight:700;letter-spacing:1.5px}.stamp{fill:#141617;font-size:13px;font-weight:700;letter-spacing:1.5px}.accent{fill:#fabd2f;font-size:18px}.success{fill:#b8bb26;font-size:18px}.info{fill:#83a598;font-size:18px}.line-number{fill:#928374;font-size:15px}.canvas-text{fill:#141617;font-size:15px;font-weight:700}.title-small{fill:#fbf1c7;font-size:24px;font-weight:700}.rule{stroke:#3c3836;stroke-width:1}.signal{stroke:#928374;stroke-width:2}.node{fill:#928374}.live,.focus{fill:#fabd2f}.info-box{fill:#83a598}.success-box{fill:#b8bb26}.status{fill:#fabd2f}.selected{fill:#3c3836;stroke:#928374;stroke-width:1}.swatch-canvas{fill:#141617;stroke:#3c3836}.swatch-surface{fill:#1d2021;stroke:#3c3836}</style>
<rect width="1200" height="630" class="canvas"/>
<rect x="40" y="40" width="1120" height="550" class="frame"/>
<rect x="40" y="40" width="1120" height="64" fill="#1d2021"/>
<rect x="914" y="57" width="214" height="30" fill="#fabd2f"/>
<text x="72" y="80" class="label" text-anchor="start">APOLLO DARK / BROWSER</text>
<text x="1021" y="78" class="stamp" text-anchor="middle">SIMULATED PREVIEW</text>
<g class="layout layout-browser-chrome"><rect x="70" y="142" width="1060" height="366" class="panel"/><rect x="70" y="142" width="1060" height="76" class="raised"/><rect x="92" y="152" width="224" height="28" class="selected"/><text x="106" y="172" class="bright" text-anchor="start">Apollo Theme</text><text x="102" y="204" class="dim" text-anchor="start">‹  ›  ↻</text><rect x="190" y="185" width="760" height="24" class="selected"/><text x="208" y="204" class="body" text-anchor="start">apollo-theme.github.io</text><rect x="70" y="218" width="224" height="290" class="raised"/><text x="96" y="254" class="label" text-anchor="start">FIREFOX</text><text x="96" y="303" class="body" text-anchor="start">General</text><text x="96" y="350" class="bright" text-anchor="start">Extensions &amp; Themes</text><text x="324" y="266" class="title-small" text-anchor="start">APOLLO / NIGHT FLIGHT</text><text x="324" y="304" class="dim" text-anchor="start">Browser chrome and web surfaces carry the same semantic signal.</text><rect x="324" y="342" width="160" height="110" class="swatch-canvas"/><rect x="500" y="342" width="160" height="110" class="swatch-surface"/><rect x="676" y="342" width="160" height="110" class="focus"/><rect x="852" y="342" width="160" height="110" class="info-box"/><rect x="852" y="468" width="160" height="30" class="focus"/><text x="932" y="489" class="canvas-text" text-anchor="middle">Enable Apollo</text></g>
<line x1="70" y1="548" x2="1130" y2="548" class="rule"/>
<text x="70" y="578" class="bright" text-anchor="start">Firefox</text>
<text x="1130" y="578" class="dim" text-anchor="end">Browser chrome and web surfaces carry the same semantic signal.</text>
</svg>
