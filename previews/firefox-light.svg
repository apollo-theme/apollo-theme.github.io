<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Apollo Light for Firefox — simulated preview</title>
<desc id="desc">A clearly labeled simulated Firefox interface using the Apollo Light color palette.</desc>
<style>.canvas{fill:#f9f5d7}.frame,.panel{fill:#f9f5d7;stroke:#ebdbb2;stroke-width:1}.raised,.toolbar{fill:#fbf1c7;stroke:#ebdbb2;stroke-width:1}.body,.bright,.dim,.label,.accent,.success,.info,.line-number,.canvas-text,.stamp,.title-small{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.body{fill:#3c3836;font-size:18px}.bright{fill:#282828;font-size:18px}.dim{fill:#504945;font-size:16px}.label{fill:#504945;font-size:14px;font-weight:700;letter-spacing:1.5px}.stamp{fill:#f9f5d7;font-size:13px;font-weight:700;letter-spacing:1.5px}.accent{fill:#8a5200;font-size:18px}.success{fill:#6b6700;font-size:18px}.info{fill:#076678;font-size:18px}.line-number{fill:#665c54;font-size:15px}.canvas-text{fill:#f9f5d7;font-size:15px;font-weight:700}.title-small{fill:#282828;font-size:24px;font-weight:700}.rule{stroke:#ebdbb2;stroke-width:1}.signal{stroke:#665c54;stroke-width:2}.node{fill:#665c54}.live,.focus{fill:#8a5200}.info-box{fill:#076678}.success-box{fill:#6b6700}.status{fill:#8a5200}.selected{fill:#ebdbb2;stroke:#665c54;stroke-width:1}.swatch-canvas{fill:#f9f5d7;stroke:#ebdbb2}.swatch-surface{fill:#fbf1c7;stroke:#ebdbb2}</style>
<rect width="1200" height="630" class="canvas"/>
<rect x="40" y="40" width="1120" height="550" class="frame"/>
<rect x="40" y="40" width="1120" height="64" fill="#fbf1c7"/>
<rect x="914" y="57" width="214" height="30" fill="#8a5200"/>
<text x="72" y="80" class="label" text-anchor="start">APOLLO LIGHT / BROWSER</text>
<text x="1021" y="78" class="stamp" text-anchor="middle">SIMULATED PREVIEW</text>
<g class="layout layout-browser-chrome"><rect x="70" y="142" width="1060" height="366" class="panel"/><rect x="70" y="142" width="1060" height="76" class="raised"/><rect x="92" y="152" width="224" height="28" class="selected"/><text x="106" y="172" class="bright" text-anchor="start">Apollo Theme</text><text x="102" y="204" class="dim" text-anchor="start">‹  ›  ↻</text><rect x="190" y="185" width="760" height="24" class="selected"/><text x="208" y="204" class="body" text-anchor="start">apollo-light-theme.github.io</text><rect x="70" y="218" width="224" height="290" class="raised"/><text x="96" y="254" class="label" text-anchor="start">FIREFOX</text><text x="96" y="303" class="body" text-anchor="start">General</text><text x="96" y="350" class="bright" text-anchor="start">Extensions &amp; Themes</text><text x="324" y="266" class="title-small" text-anchor="start">APOLLO LIGHT / DAY FLIGHT</text><text x="324" y="304" class="dim" text-anchor="start">Browser chrome and web surfaces share one day palette.</text><rect x="324" y="342" width="160" height="110" class="swatch-canvas"/><rect x="500" y="342" width="160" height="110" class="swatch-surface"/><rect x="676" y="342" width="160" height="110" class="focus"/><rect x="852" y="342" width="160" height="110" class="info-box"/><rect x="852" y="468" width="160" height="30" class="focus"/><text x="932" y="489" class="canvas-text" text-anchor="middle">Enable Apollo Light</text></g>
<line x1="70" y1="548" x2="1130" y2="548" class="rule"/>
<text x="70" y="578" class="bright" text-anchor="start">Firefox</text>
<text x="1130" y="578" class="dim" text-anchor="end">Browser chrome and web surfaces share one day palette.</text>
</svg>
