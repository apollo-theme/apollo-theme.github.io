<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Apollo for iTerm2 — simulated preview</title>
<desc id="desc">A clearly labeled simulated iTerm2 interface using the Apollo color palette.</desc>
<style>.canvas{fill:#141617}.frame,.panel{fill:#141617;stroke:#3c3836;stroke-width:1}.raised,.toolbar{fill:#1d2021;stroke:#3c3836;stroke-width:1}.body,.bright,.dim,.label,.accent,.success,.info,.line-number,.canvas-text,.stamp,.title-small{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.body{fill:#cfbc97;font-size:18px}.bright{fill:#fbf1c7;font-size:18px}.dim{fill:#d5c4a1;font-size:16px}.label{fill:#d5c4a1;font-size:14px;font-weight:700;letter-spacing:1.5px}.stamp{fill:#141617;font-size:13px;font-weight:700;letter-spacing:1.5px}.accent{fill:#fabd2f;font-size:18px}.success{fill:#b8bb26;font-size:18px}.info{fill:#83a598;font-size:18px}.line-number{fill:#928374;font-size:15px}.canvas-text{fill:#141617;font-size:15px;font-weight:700}.title-small{fill:#fbf1c7;font-size:24px;font-weight:700}.rule{stroke:#3c3836;stroke-width:1}.signal{stroke:#928374;stroke-width:2}.node{fill:#928374}.live,.focus{fill:#fabd2f}.info-box{fill:#83a598}.success-box{fill:#b8bb26}.status{fill:#fabd2f}.selected{fill:#3c3836;stroke:#928374;stroke-width:1}.swatch-canvas{fill:#141617;stroke:#3c3836}.swatch-surface{fill:#1d2021;stroke:#3c3836}</style>
<rect width="1200" height="630" class="canvas"/>
<rect x="40" y="40" width="1120" height="550" class="frame"/>
<rect x="40" y="40" width="1120" height="64" fill="#1d2021"/>
<rect x="914" y="57" width="214" height="30" fill="#fabd2f"/>
<text x="72" y="80" class="label" text-anchor="start">APOLLO / TERMINAL</text>
<text x="1021" y="78" class="stamp" text-anchor="middle">SIMULATED PREVIEW</text>
<g class="layout layout-split-shell"><rect x="70" y="142" width="1060" height="366" class="panel"/><rect x="70" y="142" width="1060" height="45" class="raised"/><rect x="86" y="151" width="250" height="36" class="selected"/><text x="106" y="176" class="bright" text-anchor="start">iTerm2</text><text x="362" y="176" class="dim" text-anchor="start">server</text><line x1="620" y1="187" x2="620" y2="508" class="rule"/><text x="94" y="224" class="label" text-anchor="start">LOCAL</text><text x="104" y="270" class="bright" text-anchor="start">$ git status --short</text><text x="104" y="315" class="info" text-anchor="start"> M assets/site.css</text><text x="104" y="360" class="body" text-anchor="start">?? previews/</text><text x="646" y="224" class="label" text-anchor="start">PROFILE / CONFIG</text><text x="656" y="270" class="bright" text-anchor="start">Profile: Apollo</text><rect x="70" y="484" width="1060" height="24" class="status"/><text x="88" y="502" class="canvas-text" text-anchor="start">apollo/theme · pane 1 of 2</text></g>
<line x1="70" y1="548" x2="1130" y2="548" class="rule"/>
<text x="70" y="578" class="bright" text-anchor="start">iTerm2</text>
<text x="1130" y="578" class="dim" text-anchor="end">A macOS split session with a quiet profile rail.</text>
</svg>
