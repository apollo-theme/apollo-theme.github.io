<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Apollo Light for Xcode — simulated preview</title>
<desc id="desc">A clearly labeled simulated Xcode interface using the Apollo Light color palette.</desc>
<style>.canvas{fill:#f9f5d7}.frame,.panel{fill:#f9f5d7;stroke:#ebdbb2;stroke-width:1}.raised,.toolbar{fill:#fbf1c7;stroke:#ebdbb2;stroke-width:1}.body,.bright,.dim,.label,.accent,.success,.info,.line-number,.canvas-text,.stamp,.title-small{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.body{fill:#3c3836;font-size:18px}.bright{fill:#282828;font-size:18px}.dim{fill:#504945;font-size:16px}.label{fill:#504945;font-size:14px;font-weight:700;letter-spacing:1.5px}.stamp{fill:#f9f5d7;font-size:13px;font-weight:700;letter-spacing:1.5px}.accent{fill:#8a5200;font-size:18px}.success{fill:#6b6700;font-size:18px}.info{fill:#076678;font-size:18px}.line-number{fill:#665c54;font-size:15px}.canvas-text{fill:#f9f5d7;font-size:15px;font-weight:700}.title-small{fill:#282828;font-size:24px;font-weight:700}.rule{stroke:#ebdbb2;stroke-width:1}.signal{stroke:#665c54;stroke-width:2}.node{fill:#665c54}.live,.focus{fill:#8a5200}.info-box{fill:#076678}.success-box{fill:#6b6700}.status{fill:#8a5200}.selected{fill:#ebdbb2;stroke:#665c54;stroke-width:1}.swatch-canvas{fill:#f9f5d7;stroke:#ebdbb2}.swatch-surface{fill:#fbf1c7;stroke:#ebdbb2}</style>
<rect width="1200" height="630" class="canvas"/>
<rect x="40" y="40" width="1120" height="550" class="frame"/>
<rect x="40" y="40" width="1120" height="64" fill="#fbf1c7"/>
<rect x="914" y="57" width="214" height="30" fill="#8a5200"/>
<text x="72" y="80" class="label" text-anchor="start">APOLLO LIGHT / EDITOR</text>
<text x="1021" y="78" class="stamp" text-anchor="middle">SIMULATED PREVIEW</text>
<g class="layout layout-ide-inspector"><rect x="70" y="142" width="1060" height="366" class="panel"/><rect x="70" y="142" width="1060" height="42" class="raised"/><text x="92" y="170" class="dim" text-anchor="start">File  Edit  View  Git  Run  Terminal</text><rect x="70" y="184" width="236" height="300" class="raised"/><text x="94" y="218" class="label" text-anchor="start">EXPLORER</text><text x="94" y="262" class="body" text-anchor="start">▾ APOLLO</text><text x="114" y="304" class="dim" text-anchor="start">▾ source</text><text x="134" y="346" class="bright" text-anchor="start">theme</text><text x="114" y="388" class="dim" text-anchor="start">palette.json</text><text x="94" y="448" class="label" text-anchor="start">OUTLINE</text><rect x="306" y="184" width="824" height="300" class="panel"/><text x="332" y="218" class="label" text-anchor="start">Xcode / theme source</text><text x="342" y="268" class="bright" text-anchor="start">struct Apollo LightTheme {</text><text x="342" y="316" class="info" text-anchor="start">static let canvas = 0xf9f5d7</text><text x="342" y="364" class="body" text-anchor="start">static let focus = 0x8a5200</text><text x="342" y="412" class="success" text-anchor="start">Build Succeeded</text><rect x="70" y="484" width="1060" height="24" class="status"/><text x="88" y="502" class="canvas-text" text-anchor="start">main*</text><text x="1112" y="502" class="canvas-text" text-anchor="end">UTF-8 · Ln 14</text></g>
<line x1="70" y1="548" x2="1130" y2="548" class="rule"/>
<text x="70" y="578" class="bright" text-anchor="start">Xcode</text>
<text x="1130" y="578" class="dim" text-anchor="end">Navigator, source, inspector, and console on one plane.</text>
</svg>
