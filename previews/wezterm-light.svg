<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Apollo Light for WezTerm — simulated preview</title>
<desc id="desc">A clearly labeled simulated WezTerm interface using the Apollo Light color palette.</desc>
<style>.canvas{fill:#f9f5d7}.frame,.panel{fill:#f9f5d7;stroke:#ebdbb2;stroke-width:1}.raised,.toolbar{fill:#fbf1c7;stroke:#ebdbb2;stroke-width:1}.body,.bright,.dim,.label,.accent,.success,.info,.line-number,.canvas-text,.stamp,.title-small{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.body{fill:#3c3836;font-size:18px}.bright{fill:#282828;font-size:18px}.dim{fill:#504945;font-size:16px}.label{fill:#504945;font-size:14px;font-weight:700;letter-spacing:1.5px}.stamp{fill:#f9f5d7;font-size:13px;font-weight:700;letter-spacing:1.5px}.accent{fill:#8a5200;font-size:18px}.success{fill:#6b6700;font-size:18px}.info{fill:#076678;font-size:18px}.line-number{fill:#665c54;font-size:15px}.canvas-text{fill:#f9f5d7;font-size:15px;font-weight:700}.title-small{fill:#282828;font-size:24px;font-weight:700}.rule{stroke:#ebdbb2;stroke-width:1}.signal{stroke:#665c54;stroke-width:2}.node{fill:#665c54}.live,.focus{fill:#8a5200}.info-box{fill:#076678}.success-box{fill:#6b6700}.status{fill:#8a5200}.selected{fill:#ebdbb2;stroke:#665c54;stroke-width:1}.swatch-canvas{fill:#f9f5d7;stroke:#ebdbb2}.swatch-surface{fill:#fbf1c7;stroke:#ebdbb2}</style>
<rect width="1200" height="630" class="canvas"/>
<rect x="40" y="40" width="1120" height="550" class="frame"/>
<rect x="40" y="40" width="1120" height="64" fill="#fbf1c7"/>
<rect x="914" y="57" width="214" height="30" fill="#8a5200"/>
<text x="72" y="80" class="label" text-anchor="start">APOLLO LIGHT / TERMINAL</text>
<text x="1021" y="78" class="stamp" text-anchor="middle">SIMULATED PREVIEW</text>
<g class="layout layout-split-shell"><rect x="70" y="142" width="1060" height="366" class="panel"/><rect x="70" y="142" width="1060" height="45" class="raised"/><rect x="86" y="151" width="250" height="36" class="selected"/><text x="106" y="176" class="bright" text-anchor="start">WezTerm</text><text x="362" y="176" class="dim" text-anchor="start">server</text><line x1="620" y1="187" x2="620" y2="508" class="rule"/><text x="94" y="224" class="label" text-anchor="start">LOCAL</text><text x="104" y="270" class="bright" text-anchor="start">$ wezterm cli list</text><text x="104" y="315" class="info" text-anchor="start">WIN TAB PANE TITLE</text><text x="104" y="360" class="body" text-anchor="start">0   0   0    theme</text><text x="646" y="224" class="label" text-anchor="start">PROFILE / CONFIG</text><text x="656" y="270" class="bright" text-anchor="start">return { color_scheme = &#x27;Apollo Light&#x27; }</text><rect x="70" y="484" width="1060" height="24" class="status"/><text x="88" y="502" class="canvas-text" text-anchor="start">apollo/theme · pane 1 of 2</text></g>
<line x1="70" y1="548" x2="1130" y2="548" class="rule"/>
<text x="70" y="578" class="bright" text-anchor="start">WezTerm</text>
<text x="1130" y="578" class="dim" text-anchor="end">Lua tabs and panes on one flight deck.</text>
</svg>
