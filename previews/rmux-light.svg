<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Apollo Light for RMUX — simulated preview</title>
<desc id="desc">A clearly labeled simulated RMUX interface using the Apollo Light color palette.</desc>
<style>.canvas{fill:#f9f5d7}.frame,.panel{fill:#f9f5d7;stroke:#ebdbb2;stroke-width:1}.raised,.toolbar{fill:#fbf1c7;stroke:#ebdbb2;stroke-width:1}.body,.bright,.dim,.label,.accent,.success,.info,.line-number,.canvas-text,.stamp,.title-small{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.body{fill:#3c3836;font-size:18px}.bright{fill:#282828;font-size:18px}.dim{fill:#504945;font-size:16px}.label{fill:#504945;font-size:14px;font-weight:700;letter-spacing:1.5px}.stamp{fill:#f9f5d7;font-size:13px;font-weight:700;letter-spacing:1.5px}.accent{fill:#8a5200;font-size:18px}.success{fill:#6b6700;font-size:18px}.info{fill:#076678;font-size:18px}.line-number{fill:#665c54;font-size:15px}.canvas-text{fill:#f9f5d7;font-size:15px;font-weight:700}.title-small{fill:#282828;font-size:24px;font-weight:700}.rule{stroke:#ebdbb2;stroke-width:1}.signal{stroke:#665c54;stroke-width:2}.node{fill:#665c54}.live,.focus{fill:#8a5200}.info-box{fill:#076678}.success-box{fill:#6b6700}.status{fill:#8a5200}.selected{fill:#ebdbb2;stroke:#665c54;stroke-width:1}.swatch-canvas{fill:#f9f5d7;stroke:#ebdbb2}.swatch-surface{fill:#fbf1c7;stroke:#ebdbb2}</style>
<rect width="1200" height="630" class="canvas"/>
<rect x="40" y="40" width="1120" height="550" class="frame"/>
<rect x="40" y="40" width="1120" height="64" fill="#fbf1c7"/>
<rect x="914" y="57" width="214" height="30" fill="#8a5200"/>
<text x="72" y="80" class="label" text-anchor="start">APOLLO LIGHT / MULTIPLEXER</text>
<text x="1021" y="78" class="stamp" text-anchor="middle">SIMULATED PREVIEW</text>
<g class="layout layout-mission-board"><rect x="70" y="142" width="1060" height="366" class="panel"/><rect x="70" y="142" width="226" height="366" class="raised"/><text x="94" y="180" class="label" text-anchor="start">RMUX / SESSIONS</text><rect x="88" y="202" width="190" height="46" class="selected"/><text x="104" y="232" class="bright" text-anchor="start">● apollo-site</text><text x="104" y="286" class="body" text-anchor="start">3 panes · 1 active</text><text x="104" y="342" class="dim" text-anchor="start">○ docs</text><rect x="296" y="142" width="834" height="342" class="panel"/><text x="322" y="180" class="label" text-anchor="start">MISSION CONTROL</text><rect x="318" y="210" width="380" height="240" class="panel"/><rect x="720" y="210" width="386" height="105" class="raised"/><rect x="720" y="337" width="386" height="113" class="raised"/><text x="342" y="250" class="label" text-anchor="start">PRIMARY</text><text x="342" y="304" class="bright" text-anchor="start">$ ./scripts/check.py</text><text x="342" y="358" class="success" text-anchor="start">34 previews verified</text><text x="744" y="250" class="label" text-anchor="start">WATCH</text><text x="744" y="290" class="success" text-anchor="start">assets/site.css clean</text><text x="744" y="377" class="label" text-anchor="start">NOTES</text><text x="744" y="421" class="accent" text-anchor="start">Dark + Light viewport pass complete</text><rect x="296" y="484" width="834" height="24" class="status"/><text x="316" y="502" class="canvas-text" text-anchor="start">CTRL+A panes · CTRL+G sessions</text></g>
<line x1="70" y1="548" x2="1130" y2="548" class="rule"/>
<text x="70" y="578" class="bright" text-anchor="start">RMUX</text>
<text x="1130" y="578" class="dim" text-anchor="end">Session orchestration as a compact mission board.</text>
</svg>
