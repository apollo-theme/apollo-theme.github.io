<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Apollo for SonicTerm — simulated preview</title>
<desc id="desc">A clearly labeled simulated SonicTerm interface using the Apollo color palette.</desc>
<style>.canvas{fill:#141617}.frame,.panel{fill:#141617;stroke:#3c3836;stroke-width:1}.raised,.toolbar{fill:#1d2021;stroke:#3c3836;stroke-width:1}.body,.bright,.dim,.label,.accent,.success,.info,.line-number,.canvas-text,.stamp,.title-small{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.body{fill:#cfbc97;font-size:18px}.bright{fill:#fbf1c7;font-size:18px}.dim{fill:#d5c4a1;font-size:16px}.label{fill:#d5c4a1;font-size:14px;font-weight:700;letter-spacing:1.5px}.stamp{fill:#141617;font-size:13px;font-weight:700;letter-spacing:1.5px}.accent{fill:#fabd2f;font-size:18px}.success{fill:#b8bb26;font-size:18px}.info{fill:#83a598;font-size:18px}.line-number{fill:#928374;font-size:15px}.canvas-text{fill:#141617;font-size:15px;font-weight:700}.title-small{fill:#fbf1c7;font-size:24px;font-weight:700}.rule{stroke:#3c3836;stroke-width:1}.signal{stroke:#928374;stroke-width:2}.node{fill:#928374}.live,.focus{fill:#fabd2f}.info-box{fill:#83a598}.success-box{fill:#b8bb26}.status{fill:#fabd2f}.selected{fill:#3c3836;stroke:#928374;stroke-width:1}.swatch-canvas{fill:#141617;stroke:#3c3836}.swatch-surface{fill:#1d2021;stroke:#3c3836}</style>
<rect width="1200" height="630" class="canvas"/>
<rect x="40" y="40" width="1120" height="550" class="frame"/>
<rect x="40" y="40" width="1120" height="64" fill="#1d2021"/>
<rect x="914" y="57" width="214" height="30" fill="#fabd2f"/>
<text x="72" y="80" class="label" text-anchor="start">APOLLO / TERMINAL</text>
<text x="1021" y="78" class="stamp" text-anchor="middle">SIMULATED PREVIEW</text>
<g class="layout layout-flight-console"><rect x="70" y="142" width="740" height="366" class="panel"/><rect x="830" y="142" width="300" height="366" class="raised"/><line x1="70" y1="190" x2="810" y2="190" class="rule"/><text x="94" y="174" class="label" text-anchor="start">MISSION SHELL</text><text x="104" y="234" class="bright" text-anchor="start">apollo main</text><text x="104" y="284" class="info" text-anchor="start">$ python3 scripts/check.py</text><text x="104" y="334" class="body" text-anchor="start">palette ........ exact</text><text x="104" y="384" class="success" text-anchor="start">previews ....... 17 / 17</text><text x="104" y="434" class="accent" text-anchor="start">$ _</text><text x="854" y="174" class="label" text-anchor="start">SIGNAL</text><line x1="854" y1="220" x2="1104" y2="220" class="signal"/><circle cx="854" cy="220" r="6" class="node"/><circle cx="979" cy="220" r="6" class="node"/><circle cx="1104" cy="220" r="6" class="live"/><text x="854" y="275" class="dim" text-anchor="start">FOCUS</text><rect x="1030" y="255" width="60" height="25" class="focus"/><text x="854" y="325" class="dim" text-anchor="start">INFO</text><rect x="1030" y="305" width="60" height="25" class="info-box"/><text x="854" y="375" class="dim" text-anchor="start">SUCCESS</text><rect x="1030" y="355" width="60" height="25" class="success-box"/><text x="854" y="435" class="dim" text-anchor="start">CURSOR</text><text x="1090" y="435" class="success" text-anchor="end">READY</text></g>
<line x1="70" y1="548" x2="1130" y2="548" class="rule"/>
<text x="70" y="578" class="bright" text-anchor="start">SonicTerm</text>
<text x="1130" y="578" class="dim" text-anchor="end">The reference shell keeps the signal visible.</text>
</svg>
