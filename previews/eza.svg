<g class="layout layout-file-table"><rect x="70" y="142" width="1060" height="366" class="panel"/><rect x="70" y="142" width="1060" height="45" class="raised"/><text x="94" y="172" class="label" text-anchor="start">eza --long --git --group-directories-first</text><text x="98" y="226" class="dim" text-anchor="start">MODE   SIZE  GIT  NAME</text><line x1="96" y1="244" x2="1104" y2="244" class="rule"/><text x="98" y="294" class="bright" text-anchor="start">drwx  544B  --  assets/</text><text x="98" y="346" class="info" text-anchor="start">drwx  2.1k  --  palette/</text><text x="98" y="398" class="body" text-anchor="start">drwx   18k   N  previews/</text><text x="98" y="450" class="success" text-anchor="start">-rw-   42k   M  index.html</text><rect x="70" y="484" width="1060" height="24" class="status"/><text x="88" y="502" class="canvas-text" text-anchor="start">6 entries · sorted directories first</text></g>
<line x1="70" y1="548" x2="1130" y2="548" class="rule"/>
